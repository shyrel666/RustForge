<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242834"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="fav-steel-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="fav-steel-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="fav-steel-r" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="fav-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#fav-bg)"/>

  <g transform="translate(0, 10)">
    <!-- Top Anvil Head Facet -->
    <path d="M512 216 L768 364 L512 512 L256 364 Z" fill="url(#fav-steel-top)"/>
    <!-- Inner Cut -->
    <path d="M512 286 L660 372 L512 458 L364 372 Z" fill="#12141a" opacity="0.9"/>
    <!-- Left Pillar -->
    <path d="M256 398 L488 532 L488 776 L256 642 Z" fill="url(#fav-steel-l)"/>
    <!-- Right Pillar -->
    <path d="M536 532 L768 398 L768 642 L536 776 Z" fill="url(#fav-steel-r)"/>
    <!-- Central Forge Core -->
    <path d="M512 376 L604 492 L512 608 L420 492 Z" fill="url(#fav-core)"/>
  </g>
</svg>
