name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.93.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value

          if (
            $tagVersion -ne $packageVersion -or
            $tagVersion -ne $tauriVersion -or
            $tagVersion -ne $cargoVersion
          ) {
            throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Load and validate Chinese release notes
        id: release_notes
        shell: pwsh
        run: |
          $notesPath = Join-Path ".github/release-notes" "${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }

          $body = (Get-Content -LiteralPath $notesPath -Raw -Encoding utf8).Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            throw "Release notes must not be empty: $notesPath"
          }
          if ($body -notmatch '[\u3400-\u9fff]') {
            throw "Release notes must contain Chinese text: $notesPath"
          }
          if ($body -notmatch '(?m)^## 核心') {
            throw "Release notes must contain a level-two core features section: $notesPath"
          }
          $null = & ".github/scripts/update-updater-manifest-notes.ps1" `
            -NotesPath $notesPath `
            -PreviewOnly

          $delimiter = "RUSTFORGE_RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value "body<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value $body
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Value $delimiter

      - name: Build and publish signed updater
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "RustForge v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: "--target x86_64-pc-windows-msvc"

      - name: Normalize and verify updater release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & ".github/scripts/sync-github-release-notes.ps1" `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag "${{ github.ref_name }}" `
            -NotesPath ".github/release-notes/${{ github.ref_name }}.md" `
            -TempDirectory $env:RUNNER_TEMP `
            -RequireUpdaterManifest
