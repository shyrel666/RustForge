name: Sync release notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-notes/v*.md"
      - ".github/scripts/*.ps1"
      - ".github/workflows/sync-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and sync Chinese release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notesFiles = @(
            Get-ChildItem -LiteralPath ".github/release-notes" -File -Filter "v*.md" |
              Sort-Object Name
          )
          if ($notesFiles.Count -eq 0) {
            throw "No versioned release notes were found."
          }

          foreach ($notesFile in $notesFiles) {
            $tag = [System.IO.Path]::GetFileNameWithoutExtension($notesFile.Name)
            & ".github/scripts/sync-github-release-notes.ps1" `
              -Repository $env:GITHUB_REPOSITORY `
              -Tag $tag `
              -NotesPath $notesFile.FullName `
              -TempDirectory $env:RUNNER_TEMP `
              -SkipMissingRelease
          }
