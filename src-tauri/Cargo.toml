[package]
name = "rustforge"
version = "0.1.0"
description = "AI-guided pentest learning desktop app"
edition = "2021"
rust-version = "1.88"

[lib]
name = "rustforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# SQLite 连接池：代理高频写入与 UI 查询各用独立连接，消除单连接 Mutex 竞争与中毒
r2d2 = "0.8"
r2d2_sqlite = "0.25"
thiserror = "2"
chrono = "0.4"
# Phase 1：MITM 代理。hudsucker 0.25（hyper 1.x + rustls + rcgen 0.14）
hudsucker = { version = "0.25", features = ["http2"] }
rcgen = "0.14"
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
pem = "3"
# Phase 2：LLM API 调用（rustls 避免 OpenSSL 依赖）+ 被动规则引擎
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# Scope/URL 授权边界直接使用 WHATWG URL + IDNA 规范化，不依赖 reqwest 的传递依赖
url = "2"
regex = "1"
keyring = "4.1.5"
zeroize = "1.9"
# 解压响应体（gzip/deflate/br）供展示与分析；转发给浏览器的仍是原始压缩字节
flate2 = "1"
brotli = "8"

[dev-dependencies]
# MITM 端到端测试用：搭本地 TLS 目标站 + 自定义上游 connector
tokio-rustls = "0.26"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "logging", "webpki-tokio"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
