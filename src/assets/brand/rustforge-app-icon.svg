<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="RustForge">
  <defs>
    <!-- Soft Titanium Slate Depth (Versatile on both Light and Dark OS) -->
    <linearGradient id="rf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242834"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>

    <!-- Outer squircle subtle rim border -->
    <linearGradient id="rf-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>

    <!-- Top steel facet -->
    <linearGradient id="rf-steel-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Left steel facet -->
    <linearGradient id="rf-steel-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Right steel facet -->
    <linearGradient id="rf-steel-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Forge Core Radiant Flame Gradient -->
    <linearGradient id="rf-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="rf-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(249,115,22,0.45)"/>
      <stop offset="60%" stop-color="rgba(234,88,12,0.15)"/>
      <stop offset="100%" stop-color="rgba(234,88,12,0)"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#rf-bg-grad)" stroke="url(#rf-rim-grad)" stroke-width="6"/>

  <!-- Core Ambient Glow -->
  <circle cx="512" cy="500" r="260" fill="url(#rf-core-glow)"/>

  <!-- Geometric Anvil / Forge Structure -->
  <g transform="translate(0, 10)">
    <!-- Top Anvil Head Facet -->
    <path
      d="M512 216 L768 364 L512 512 L256 364 Z"
      fill="url(#rf-steel-top)"
    />

    <!-- Top Facet Inner Cut -->
    <path
      d="M512 286 L660 372 L512 458 L364 372 Z"
      fill="#12141a"
      opacity="0.9"
    />

    <!-- Left Structural Pillar -->
    <path
      d="M256 398 L488 532 L488 776 L256 642 Z"
      fill="url(#rf-steel-left)"
    />

    <!-- Right Structural Pillar -->
    <path
      d="M536 532 L768 398 L768 642 L536 776 Z"
      fill="url(#rf-steel-right)"
    />

    <!-- Central Floating Forge Crucible Core -->
    <path
      d="M512 376 L604 492 L512 608 L420 492 Z"
      fill="url(#rf-core-grad)"
    />

    <!-- Inner Core Spark Accent -->
    <path
      d="M512 420 L556 492 L512 564 L468 492 Z"
      fill="#ffffff"
      opacity="0.35"
    />
  </g>
</svg>
